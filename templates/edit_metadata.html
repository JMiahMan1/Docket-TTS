{% extends "base.html" %}

{% block title %}Edit Metadata - Docket-TTS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

        <div class="card glass-card border-0">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="mb-0 fw-bold">Edit Metadata</h2>
                        <p class="text-muted mb-0">Update file tags and rename</p>
                    </div>
                    <a href="{{ url_for('list_files') }}" class="btn btn-outline-secondary rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </a>
                </div>

                <div class="alert alert-warning border-0 shadow-sm mb-4">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    You are editing metadata for <strong>{{ base_name }}.mp3</strong>. The filename will be
                    automatically renamed based on these values.
                </div>

                <form method="post">
                    <div class="mb-3">
                        <label for="chapter_title" class="form-label fw-bold">Chapter Title (TIT2)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-type-h1"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="chapter_title"
                                name="chapter_title" value="{{ metadata.title }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="book_title" class="form-label fw-bold">Book Title (TALB)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-book"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="book_title"
                                name="book_title" value="{{ metadata.book_title }}">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="author" class="form-label fw-bold">Author (TPE1)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="author" name="author"
                                value="{{ metadata.author }}">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm">
                        <i class="bi bi-save me-2"></i>Update Metadata & Rename
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
