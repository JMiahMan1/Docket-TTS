services:
  redis:
    image: "redis:alpine"
    restart: always

  web:
    build:
      context: .
      # Provide default lowercase arguments for local builds
      args:
        - GITHUB_REPOSITORY=jmiahman1/docket-tts
        - BASE_IMAGE_TAG=latest
    ports:
      - "8000:5000"
    volumes:
      - generated_data:/app/generated:z
      - uploads_data:/app/uploads:z
      - voices_data:/app/voices:z
    command: /opt/venv/bin/python -m gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 300 app:app
    depends_on:
      - redis
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      # Provide default lowercase arguments for local builds
      args:
        - GITHUB_REPOSITORY=jmiahman1/docket-tts
        - BASE_IMAGE_TAG=latest
    command: /opt/venv/bin/python -m celery -A app.celery worker --loglevel=info --concurrency=3
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - ONNXRUNTIME_INTRA_OP_NUM_THREADS=1
      - KOKORO_VOICES_PATH=/app/voices
    volumes:
      - generated_data:/app/generated:z
      - uploads_data:/app/uploads:z
      - voices_data:/app/voices:z
    depends_on:
      - redis
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Removed CPU limits to allow full utilization of 16-core host

volumes:
  uploads_data:
  generated_data:
  voices_data:
